<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFI SONCAP check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f4;
    --surface: #ffffff;
    --ink: #17231d;
    --muted: #5d6b63;
    --line: #d9dfd9;
    --green: #146c43;
    --green-bg: #e3f2ea;
    --amber: #9a5b00;
    --amber-bg: #fdf0d5;
    --accent: #146c43;
    --focus: #1d5fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101612;
      --surface: #18201b;
      --ink: #e8eee9;
      --muted: #9aa8a0;
      --line: #2c3a32;
      --green: #5fc58f;
      --green-bg: #173a28;
      --amber: #f0b550;
      --amber-bg: #3b2c0e;
      --accent: #5fc58f;
      --focus: #7aa8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

  .drop {
    display: block;
    border: 2px dashed var(--line);
    background: var(--surface);
    border-radius: 6px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--green-bg); }
  .drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { display: block; font-size: 18px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .file-name { margin-top: 10px; font-size: 14px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  button {
    font: 500 15px "IBM Plex Sans", system-ui, sans-serif;
    padding: 10px 18px;
    border-radius: 4px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0b1a12; } }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 10px 4px; }

  #status { margin-top: 18px; min-height: 24px; color: var(--muted); font-size: 14px; }
  #status.error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { #status.error { color: #ff8a80; } }

  #results { margin-top: 28px; }
  .banner { border-radius: 6px; padding: 16px 18px; border-left: 6px solid; }
  .banner h2 { margin: 0 0 4px; font-size: 20px; }
  .banner p { margin: 0; }
  .banner.ok { background: var(--green-bg); border-color: var(--green); }
  .banner.ok h2 { color: var(--green); }
  .banner.review { background: var(--amber-bg); border-color: var(--amber); }
  .banner.review h2 { color: var(--amber); }

  .table-wrap { overflow-x: auto; margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; font-size: 14px; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .six { font-weight: 500; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 500; }
  .pill.match { background: var(--green-bg); color: var(--green); }
  .pill.review { background: var(--amber-bg); color: var(--amber); }
  .desc { color: var(--muted); font-size: 13px; }

  .next { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  .next h3 { margin: 0 0 8px; font-size: 16px; }
  .next ul { margin: 0; padding-left: 20px; }
  .next li { margin-bottom: 6px; }
  .demo-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Check a Proforma Invoice against SONCAP</h1>
  <p class="lede">Upload the supplier’s PFI as a PDF. We pull out every HSN code and check the first six digits against the SONCAP list.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <strong>Choose a PFI PDF</strong>
    <span>or drag it here</span>
    <div class="file-name" id="fileName"></div>
  </label>

  <div class="actions">
    <button id="check" disabled>Check HSN codes</button>
    <button id="demo" class="link" type="button">Preview with sample data</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="results" hidden>
    <div id="banner" class="banner"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>HSN on PFI</th><th>First six digits</th><th>Result</th><th>SONCAP record</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="next" id="next"></div>
    <p class="demo-note" id="demoNote" hidden>This is sample data, not your document.</p>
  </section>
</main>

<script>
/*
  Backend contract (build this at /api/verify on Vercel):
  POST multipart/form-data, field "pfi" = the PDF
  Response 200 JSON:
  {
    "allMatched": false,
    "codes": [
      { "raw": "8501.10.00", "normalized": "850110", "status": "match" | "review",
        "matched": "850110" | null, "description": "optional text from the PFI line" }
    ]
  }
*/
const API_URL = "/api/verify";

const $ = (id) => document.getElementById(id);
const fileInput = $("file"), drop = $("drop"), checkBtn = $("check");
let selected = null;

function setStatus(msg, isError) {
  const el = $("status");
  el.textContent = msg || "";
  el.className = isError ? "error" : "";
}

function pickFile(f) {
  if (!f) return;
  if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
    setStatus("That file isn’t a PDF. Choose the PFI as a PDF.", true);
    return;
  }
  selected = f;
  $("fileName").textContent = f.name;
  checkBtn.disabled = false;
  setStatus("");
}

fileInput.addEventListener("change", () => pickFile(fileInput.files[0]));
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));

checkBtn.addEventListener("click", async () => {
  if (!selected) return;
  checkBtn.disabled = true;
  setStatus("Reading the PFI and checking HSN codes…");
  $("results").hidden = true;
  try {
    const body = new FormData();
    body.append("pfi", selected);
    const res = await fetch(API_URL, { method: "POST", body });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || "The server returned " + res.status + ".");
    render(data, false);
    setStatus("");
  } catch (err) {
    setStatus("Couldn’t check this PFI. " + err.message + " If the backend isn’t built yet, use “Preview with sample data”.", true);
  } finally {
    checkBtn.disabled = false;
  }
});

$("demo").addEventListener("click", () => {
  setStatus("");
  render({
    allMatched: false,
    codes: [
      { raw: "8501.10.00", normalized: "850110", status: "match", matched: "850110", description: "Electric motors, output not exceeding 37.5 W" },
      { raw: "8544.49.00", normalized: "854449", status: "match", matched: "854449", description: "Insulated electric conductors" },
      { raw: "3926.90.90", normalized: "392690", status: "review", matched: null, description: "Other articles of plastics" },
      { raw: "9405 40 00", normalized: "940540", status: "review", matched: null, description: "Electric lamps and lighting fittings" }
    ]
  }, true);
});

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(data, isDemo) {
  const codes = Array.isArray(data.codes) ? data.codes : [];
  const review = codes.filter((c) => c.status !== "match");
  const allOk = codes.length > 0 && review.length === 0;

  const banner = $("banner");
  if (codes.length === 0) {
    banner.className = "banner review";
    banner.innerHTML = "<h2>No HSN codes found</h2><p>We couldn’t find any HSN codes in this PDF. Check that it’s the PFI and that the text is readable, then upload it again.</p>";
  } else if (allOk) {
    banner.className = "banner ok";
    banner.innerHTML = "<h2>Match found</h2><p>All " + codes.length + " HSN codes are in the SONCAP list.</p>";
  } else {
    banner.className = "banner review";
    banner.innerHTML = "<h2>Review required</h2><p>" + review.length + " of " + codes.length + " HSN codes are not in the SONCAP list.</p>";
  }

  $("rows").innerHTML = codes.map((c) => {
    const ok = c.status === "match";
    const six = esc(c.normalized || "").slice(0, 6);
    return "<tr>" +
      "<td><span class='mono'>" + esc(c.raw) + "</span>" + (c.description ? "<div class='desc'>" + esc(c.description) + "</div>" : "") + "</td>" +
      "<td><span class='mono six'>" + six + "</span></td>" +
      "<td><span class='pill " + (ok ? "match" : "review") + "'>" + (ok ? "Match found" : "Not found") + "</span></td>" +
      "<td><span class='mono'>" + (ok && c.matched ? esc(c.matched) : "Not in list") + "</span></td>" +
      "</tr>";
  }).join("");

  const next = $("next");
  if (allOk) {
    next.innerHTML = "<h3>Next step</h3><p style='margin:0'>All codes are covered. The Form M applier can start the Form M process.</p>";
  } else if (codes.length > 0) {
    next.innerHTML = "<h3>What you can do for the codes marked “Review required”</h3><ul>" +
      "<li><strong>Option A:</strong> get SONCAP for that HSN. Once the SONCAP list is updated, upload the PFI again.</li>" +
      "<li><strong>Option B:</strong> if it applies to that item, give the supplier the permitted HSN and ask them to re-send the PFI. Then upload the corrected PFI.</li>" +
      "</ul><div class='actions'><button id='again' class='ghost' type='button'>Upload a corrected PFI</button></div>";
    $("again").addEventListener("click", resetForm);
  } else {
    next.innerHTML = "<div class='actions' style='margin:0'><button id='again' class='ghost' type='button'>Upload another PFI</button></div>";
    $("again").addEventListener("click", resetForm);
  }

  $("demoNote").hidden = !isDemo;
  $("results").hidden = false;
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetForm() {
  selected = null;
  fileInput.value = "";
  $("fileName").textContent = "";
  checkBtn.disabled = true;
  $("results").hidden = true;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>
</body>
</html>
